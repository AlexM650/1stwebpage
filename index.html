<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #18168c;
            margin: 0;
            padding: 0 20px 40px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: lightgreen;
            text-align: center;
            padding: 20px;
        }
        h3 {
            color: pink;
            text-align: center;
        }
        img {
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 520px;
            height: auto;
            border: 2px solid white;
            border-radius: 10px;
        }
        .page-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 1fr);
            gap: 28px;
            align-items: start;
            max-width: 1100px;
            margin: 20px auto 0;
        }
        .writing-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
        }
        .writing-panel h2 {
            color: #18168c;
            margin-top: 0;
        }
        .writing-panel textarea {
            display: block;
            width: 100%;
            min-height: 330px;
            padding: 12px;
            background-color: pink;
            border: 2px solid #18168c;
            border-radius: 6px;
            box-sizing: border-box;
            font: 16px/1.5 Arial, sans-serif;
            resize: vertical;
        }
        @media (max-width: 700px) {
            .page-content {
                grid-template-columns: 1fr;
            }
            .writing-panel textarea {
                min-height: 220px;
            }
        }
    </style>
</head>
<body>
    <h1>Alex Mckee</h1>
    <h3>Birthday-6/5/12</h3>
    <main class="page-content">
        <div class="image-column">
            <img src="images/fishpicture.jpg" alt="Fish Picture">
        </div>
        <section class="writing-panel" aria-labelledby="writing-title">
            <h2 id="writing-title">Fishy</h2>
            <textarea placeholder="Type something here..."></textarea>
        </section>
    </main>
</body>
</html>
